<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会話フロー作成ツール（仮想チャット画面）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, doc, setDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    
    const firebaseConfig = {
      apiKey: "AIzaSyA9tHeAW35oCX1kXjRqUWGhDPnu82fyqxo",
      authDomain: "idealchat-c7219.firebaseapp.com",
      projectId: "idealchat-c7219",
      storageBucket: "idealchat-c7219.firebasestorage.app",
      messagingSenderId: "95799029795",
      appId: "1:95799029795:web:1fc34ad7c16cc5376e4196",
      measurementId: "G-2WSNZTMQVV"
    };
    
    try {
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.firebaseDB = { db, collection, doc, setDoc, getDocs };
      console.log('Firebase Firestore initialized');
    } catch (error) {
      console.warn('Firebase initialization failed:', error);
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <button id="new-scenario-button" class="new-chat-btn" type="button">
          <span class="icon">+</span>
          <span>新規ユーザー作成</span>
        </button>
      </div>
      <div class="sidebar-body">
        <div class="sidebar-section">
          <div class="section-title">保存済みシナリオ</div>
          <div id="sidebar-scenario-list" class="sidebar-list"></div>
        </div>
      </div>
    </aside>
    <div id="sidebar-overlay"></div>
    <div id="main-container">
      <header id="app-header">
        <button id="toggle-sidebar-button" class="icon-btn" type="button" aria-label="サイドバー切り替え">
          <span class="icon">☰</span>
        </button>
        <div class="scenario-name-area">
          <span id="scenario-name-display" class="scenario-name">未設定</span>
          <button id="rename-header-button" class="icon-btn" type="button" aria-label="名前を変更" style="margin-left: 8px;">
            <i data-lucide="pencil" style="width: 14px; height: 14px;"></i>
          </button>
        </div>
        <button id="screenshot-button" class="icon-btn" type="button" aria-label="スクリーンショット">
          <i data-lucide="camera" class="icon"></i>
        </button>
        <button id="settings-button" class="icon-btn" type="button" aria-label="設定">
          <i data-lucide="settings" class="icon"></i>
        </button>
      </header>

    <main id="layout">
      <section id="chat-column" aria-label="チャットメッセージ">
        <div class="message-list" id="message-list">
          <div class="message message-aiA">
            <div class="meta">AI-A</div>
            <div class="body">ここに AI-A のメッセージが入ります。</div>
          </div>
          <div class="message message-user">
            <div class="meta">User</div>
            <div class="body">ここにユーザーのメッセージが入ります。</div>
          </div>
          <div class="message message-aiB">
            <div class="meta">AI-B</div>
            <div class="body">ここに AI-B のメッセージが入ります。</div>
          </div>
        </div>
      </section>
    </main>

    <section id="composer" aria-label="メッセージ入力エリア">
      <div id="role-selector" class="control-group" aria-label="送信者選択">
        <label class="control-label">送信者</label>
        <div class="role-options">
          <label class="option"><input type="radio" name="role" value="aiA" checked> AI-A</label>
          <label class="option"><input type="radio" name="role" value="aiB"> AI-B</label>
          <label class="option"><input type="radio" name="role" value="user"> ユーザー</label>
        </div>
      </div>
      <div class="control-group input-group">
        <label class="control-label" for="message-input">メッセージ</label>
        <textarea id="message-input" rows="3" placeholder="メッセージを入力..."></textarea>
      </div>
      <div class="control-group action-group">
        <button id="send-button" type="button">送信</button>
      </div>
    </section>
    </div>
  </div>

  <div id="scenario-list-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <header class="modal-header">
        <h2>会話フロー一覧</h2>
        <button class="ghost-btn close-modal" type="button" aria-label="閉じる">×</button>
      </header>
      <div class="modal-body" id="scenario-list-container">
        <p>保存済みのシナリオがここに表示されます。</p>
      </div>
      <footer class="modal-footer">
        <button class="ghost-btn close-modal" type="button">閉じる</button>
      </footer>
    </div>
  </div>

  <div id="settings-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <header class="modal-header">
        <h2>設定</h2>
        <button class="ghost-btn close-settings-modal" type="button" aria-label="閉じる">×</button>
      </header>
      <div class="modal-body">
        <div class="settings-section">
          <h3 class="settings-section-title">送信者のタイトル設定</h3>
          <div class="settings-group">
            <label for="label-user" class="settings-label">ユーザー</label>
            <input type="text" id="label-user" class="settings-input" value="User" placeholder="User">
          </div>
          <div class="settings-group">
            <label for="label-aiA" class="settings-label">生成AI-A</label>
            <input type="text" id="label-aiA" class="settings-input" value="AI-A" placeholder="AI-A">
          </div>
          <div class="settings-group">
            <label for="label-aiB" class="settings-label">生成AI-B</label>
            <input type="text" id="label-aiB" class="settings-input" value="AI-B" placeholder="AI-B">
          </div>
        </div>
      </div>
      <footer class="modal-footer">
        <button class="ghost-btn close-settings-modal" type="button">閉じる</button>
        <button id="save-settings-button" class="primary-btn" type="button">保存</button>
      </footer>
    </div>
  </div>

  <div id="user-note-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="user-note-modal-title">プロフィール・メモ</h2>
        <button class="ghost-btn close-user-note-modal" type="button" aria-label="閉じる">×</button>
      </header>
      <div class="modal-body">
        <textarea id="user-note-textarea" rows="15" style="width: 100%; padding: 12px; font-size: 14px; font-family: inherit; border: 1px solid #ddd; border-radius: 4px; resize: vertical;" placeholder="プロフィールやメモを入力..."></textarea>
      </div>
      <footer class="modal-footer">
        <button id="save-user-note-button" type="button" class="primary-btn">保存</button>
        <button class="ghost-btn close-user-note-modal" type="button">キャンセル</button>
      </footer>
    </div>
  </div>

  <input id="import-file-input" type="file" accept="application/json,.json,.jsonl,.txt" multiple hidden>
  <div id="status-toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
